[project]
name = "docker-fava"
version = "0.1.0"
description = "Docker image for Fava beancount web interface"
requires-python = ">=3.12"
dependencies = [
    "fava==1.30.4",
    "beanprice",
    "beancount-reds-plugins==0.3.0",
    "beancount-periodic==0.2",
    "fava-dashboards==1.1.0",
    "fava-investor==1.0.1",
    "loguru==0.7.3",
    "ibflex==0.15",
    "beancount-tools-collection==1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
beanprice = { git = "https://github.com/beancount/beanprice.git" }
